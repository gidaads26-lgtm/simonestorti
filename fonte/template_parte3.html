<script>
(function(){
  var WHATSAPP = "{{WHATSAPP}}";
  var PRIMEIRO_NOME = "{{PRIMEIRO_NOME}}";
  var MSG = {
    agendar: "Olá, " + PRIMEIRO_NOME + "! Vim pelo site e gostaria de agendar uma consulta de avaliação.",
    duvida: "Olá, " + PRIMEIRO_NOME + "! Vim pelo site e tenho uma dúvida antes de agendar."
  };
  var reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var doc = document.documentElement;

  document.querySelectorAll("[data-wa]").forEach(function(a){
    a.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(MSG[a.dataset.wa] || MSG.agendar);
  });
  document.querySelectorAll("[data-ano]").forEach(function(s){ s.textContent = new Date().getFullYear(); });

  /* entrada da hero */
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.body.classList.add("pronto"); }); });

  /* aviso ao abrir WhatsApp ou Instagram */
  var aviso = document.getElementById("aviso"), tAviso;
  document.addEventListener("click", function(e){
    var a = e.target.closest("[data-aviso]");
    if(!a) return;
    aviso.textContent = a.dataset.aviso === "insta" ? "Abrindo o Instagram de " + PRIMEIRO_NOME + "…" : "Abrindo o WhatsApp de " + PRIMEIRO_NOME + "…";
    aviso.classList.add("mostra");
    clearTimeout(tAviso);
    tAviso = setTimeout(function(){ aviso.classList.remove("mostra"); }, 2600);
  });

  /* menu do celular */
  var cab = document.getElementById("cabecalho");
  var hamb = cab.querySelector(".hamb");
  function fechaMenu(){ cab.classList.remove("aberto"); hamb.setAttribute("aria-expanded","false"); hamb.setAttribute("aria-label","Abrir menu"); document.body.style.overflow=""; }
  hamb.addEventListener("click", function(){
    var abre = !cab.classList.contains("aberto");
    cab.classList.toggle("aberto", abre);
    hamb.setAttribute("aria-expanded", abre);
    hamb.setAttribute("aria-label", abre ? "Fechar menu" : "Abrir menu");
    document.body.style.overflow = abre ? "hidden" : "";
  });
  cab.querySelectorAll(".painel a").forEach(function(a){ a.addEventListener("click", fechaMenu); });
  document.addEventListener("keydown", function(e){
    if(!cab.classList.contains("aberto")) return;
    if(e.key === "Escape"){ fechaMenu(); hamb.focus(); return; }
    if(e.key === "Tab"){
      var f = [hamb].concat(Array.prototype.slice.call(cab.querySelectorAll(".painel a")));
      var i = f.indexOf(document.activeElement);
      if(e.shiftKey && i <= 0){ e.preventDefault(); f[f.length-1].focus(); }
      else if(!e.shiftKey && i === f.length-1){ e.preventDefault(); f[0].focus(); }
      else if(i === -1){ e.preventDefault(); f[0].focus(); }
    }
  });

  /* rolagem: cabeçalho, barra fixa, fio e linha do tempo */
  var barra = document.getElementById("barra");
  var barraLink = barra.querySelector("a");
  var hero = document.getElementById("topo");
  var final = document.getElementById("agendar");
  var fio = document.querySelector(".fio-rolagem span");
  var progresso = document.querySelector(".progresso");
  var heroFoto = document.querySelector(".hero-foto");
  var barraChamou = false;
  var frases = document.querySelectorAll(".frases li");
  var passos = document.querySelector("[data-passos]");
  var itensPasso = passos ? passos.querySelectorAll(".passo") : [];
  var ultimoY = window.scrollY, agendado = false;
  var mq = window.matchMedia("(max-width: 899px)");

  function aoRolar(){
    agendado = false;
    var y = window.scrollY, vh = window.innerHeight;
    cab.classList.toggle("rolou", y > 20);
    if(mq.matches && !cab.classList.contains("aberto")){
      if(y > ultimoY + 6 && y > 140) cab.classList.add("escondido");
      else if(y < ultimoY - 6 || y < 140) cab.classList.remove("escondido");
    } else cab.classList.remove("escondido");
    ultimoY = y;

    var mostra = hero.getBoundingClientRect().bottom < 0 && final.getBoundingClientRect().top > vh * 0.92;
    barra.classList.toggle("mostra", mostra);
    if(mostra && !barraChamou && mq.matches && !reduz){ barraChamou = true; barra.classList.add("chamou"); }
    barraLink.tabIndex = mostra && mq.matches ? 0 : -1;

    if(frases.length && mq.matches && !reduz){
      var caixa = frases[0].parentElement.getBoundingClientRect(), perto = null, menor = Infinity;
      if(caixa.bottom > 0 && caixa.top < vh){
        frases.forEach(function(li){ var r = li.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - vh * 0.5); if(d < menor){ menor = d; perto = li; } });
      }
      frases.forEach(function(li){ li.classList.toggle("foco", li === perto); });
    }
    var maxR = document.documentElement.scrollHeight - vh;
    if(progresso) progresso.style.transform = "scaleX(" + (maxR > 0 ? Math.min(1, y / maxR) : 0).toFixed(4) + ")";
    if(heroFoto && !reduz && mq.matches && y < vh * 1.3) heroFoto.style.translate = "0 " + (y * 0.12).toFixed(1) + "px";
    if(fio && !reduz){
      var max = document.documentElement.scrollHeight - vh;
      fio.style.transform = "scaleY(" + (max > 0 ? y / max : 0) + ")";
    }
    if(passos && !reduz){
      var r = passos.getBoundingClientRect();
      var alvo = vh * 0.62;
      var p = (alvo - r.top) / r.height;
      p = Math.max(0, Math.min(1, p));
      passos.style.setProperty("--prog", p.toFixed(3));
      itensPasso.forEach(function(li){
        var n = li.querySelector(".num").getBoundingClientRect();
        li.classList.toggle("ativo", n.top + n.height / 2 < alvo);
      });
    }
  }
  window.addEventListener("scroll", function(){ if(!agendado){ agendado = true; requestAnimationFrame(aoRolar); } }, {passive:true});
  window.addEventListener("resize", aoRolar);
  aoRolar();
  if(reduz){ itensPasso.forEach(function(li){ li.classList.add("ativo"); }); }

  /* revelações */
  var alvos = document.querySelectorAll("[data-revelar],[data-linha]");
  if(reduz || !("IntersectionObserver" in window)){
    alvos.forEach(function(el){ el.classList.add("visivel"); });
  } else {
    /* títulos usam máscara (área zero no início), então observamos o bloco em volta */
    var mapa = new Map();
    var io = new IntersectionObserver(function(ents){
      ents.forEach(function(en){
        if(!en.isIntersecting) return;
        (mapa.get(en.target) || []).forEach(function(el){ el.classList.add("visivel"); });
        io.unobserve(en.target);
      });
    }, {rootMargin: "0px 0px -8% 0px", threshold: 0.08});
    alvos.forEach(function(el){
      var obs = el.tagName === "H2" ? el.parentElement : el;
      if(!mapa.has(obs)) mapa.set(obs, []);
      mapa.get(obs).push(el);
    });
    mapa.forEach(function(_, obs){ io.observe(obs); });
  }

  /* carrosséis com indicadores */
  document.querySelectorAll("[data-carrossel]").forEach(function(c){
    var pontos = c.nextElementSibling;
    if(!pontos || !pontos.hasAttribute("data-pontos")) return;
    var itens = Array.prototype.slice.call(c.children);
    itens.forEach(function(it, i){
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "Ver cartão " + (i + 1) + " de " + itens.length);
      b.addEventListener("click", function(){
        c.scrollTo({left: it.offsetLeft - (c.clientWidth - it.clientWidth) / 2, behavior: reduz ? "auto" : "smooth"});
      });
      pontos.appendChild(b);
    });
    var bots = pontos.querySelectorAll("button");
    function marca(){
      var centro = c.scrollLeft + c.clientWidth / 2, melhor = 0, dist = Infinity;
      itens.forEach(function(it, i){
        var d = Math.abs(it.offsetLeft + it.clientWidth / 2 - centro);
        if(d < dist){ dist = d; melhor = i; }
      });
      bots.forEach(function(b, i){ b.setAttribute("aria-current", i === melhor ? "true" : "false"); });
      itens.forEach(function(it, i){ it.classList.toggle("atual", i === melhor); });
    }
    c.addEventListener("scroll", function(){ requestAnimationFrame(marca); }, {passive:true});
    marca();
  });
  /* onda a partir do ponto tocado */
  document.addEventListener("pointerdown", function(e){
    if(reduz) return;
    var b = e.target.closest(".btn,.icone-btn,.redes a");
    if(!b) return;
    var r = b.getBoundingClientRect(), t = Math.max(r.width, r.height) * 2.2;
    var o = document.createElement("span");
    o.className = "onda";
    o.style.width = o.style.height = t + "px";
    o.style.left = (e.clientX - r.left - t / 2) + "px";
    o.style.top = (e.clientY - r.top - t / 2) + "px";
    b.appendChild(o);
    o.addEventListener("animationend", function(){ o.remove(); });
  }, {passive:true});

})();
</script>
</body>
</html>
