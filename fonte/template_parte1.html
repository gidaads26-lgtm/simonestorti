<style>
/*
VOICE: calmo, clínico e acolhedor, como um consultório bem cuidado.
IDEA: a sala de atendimento, com luz lateral, superfícies claras e o arco da porta.
PICTURE: a foto da Simone em arco, sangrando até a borda direita.
COLOUR e TYPE: porcelana, branco, marinho e champanhe; Gilda Display leve nos títulos e Figtree no texto.
LAYOUT: blocos claros em tons alternados, ícones de traço fino em círculo, faixas com divisórias finas.
*/
:root{
  --porcelana:#F4F5F8;
  --branco:#FFFFFF;
  --marinho:#0D2352;
  --noite:#081634;
  --champanhe:#D9C08A;
  --grafite:#2A2F3A;
  --cinza:#525A6C;
  --nevoa:#C3CCE0;
  --tom-azul:#E7EBF2;
  --tom-ouro:#F3EDE0;
  --ouro-texto:#7A5E26;
  --fio:rgba(13,35,82,.12);
  --ease:cubic-bezier(.23,1,.32,1);
  --larg:1200px;
  --gutter:clamp(1.25rem,4vw,2.75rem);
  --titulo:"Gilda Display",Georgia,serif;
  --texto:"Figtree",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--porcelana);color:var(--grafite);font-family:var(--texto);font-size:1.09375rem;line-height:1.7;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
h1,h2,h3{font-family:var(--titulo);font-weight:400;line-height:1.1;margin:0;color:var(--marinho);letter-spacing:-.005em;text-wrap:balance}
p{margin:0}
.wrap{width:100%;max-width:var(--larg);margin:0 auto;padding:0 var(--gutter)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr:focus-visible{position:fixed;left:1rem;top:1rem;width:auto;height:auto;clip:auto;z-index:100;background:var(--marinho);color:var(--porcelana);padding:.8rem 1.1rem;border-radius:4px}
.nq{white-space:nowrap}
:focus{outline:none}
:focus-visible{outline:2px solid var(--marinho);outline-offset:3px;border-radius:3px}
.final :focus-visible,.rodape :focus-visible,.painel :focus-visible,.barra :focus-visible{outline-color:var(--champanhe)}

/* ícone em círculo de traço fino */
.circ{display:inline-flex;align-items:center;justify-content:center;width:3.4rem;height:3.4rem;border-radius:50%;box-shadow:inset 0 0 0 1px var(--marinho);color:var(--marinho);flex:none;transition:background-color .2s var(--ease),color .2s var(--ease)}
.circ svg{width:1.45rem;height:1.45rem}
.circ.peq{width:2.4rem;height:2.4rem}
.circ.peq svg{width:1.1rem;height:1.1rem}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.7rem;min-height:3.5rem;padding:0 1.5rem;border-radius:4px;font-family:var(--texto);font-weight:500;font-size:1rem;letter-spacing:.005em;text-decoration:none;white-space:nowrap;transition:transform .16s var(--ease),background-color .2s var(--ease),box-shadow .2s var(--ease)}
.btn svg{width:1.15rem;height:1.15rem;flex:none}
.btn .seta{width:1.1rem;height:1.1rem;margin-left:.2rem;transition:transform .2s var(--ease)}
.btn-pri{background:var(--marinho);color:var(--porcelana)}
.btn-ouro{background:var(--champanhe);color:var(--noite)}
.btn-linha{background:transparent;color:var(--marinho);box-shadow:inset 0 0 0 1px var(--marinho)}
@media (hover:hover){
  .btn-pri:hover{background:#16306a}
  .btn-ouro:hover{background:#E3CD9D}
  .btn-linha:hover{background:var(--marinho);color:var(--porcelana)}
  .btn:hover .seta{transform:translateX(4px)}
}
.btn:active{transform:scale(.97)}
.link-seta{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;font-weight:500;color:var(--marinho);text-decoration:none}
.link-seta .seta{width:1.05rem;height:1.05rem;transition:transform .2s var(--ease)}
@media (hover:hover){.link-seta:hover .seta{transform:translateX(4px)}}
.link-seta:active{opacity:.7}
.icone-btn{display:inline-flex;align-items:center;justify-content:center;width:3.5rem;height:3.5rem;border-radius:50%;box-shadow:inset 0 0 0 1px currentColor;color:var(--marinho);transition:transform .16s var(--ease),background-color .2s var(--ease),color .2s var(--ease)}
.icone-btn svg{width:1.35rem;height:1.35rem}
@media (hover:hover){.icone-btn:hover{background:var(--marinho);color:var(--porcelana)}}
.icone-btn:active{transform:scale(.92)}

/* ---------- cabeçalho ---------- */
.cabecalho{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--fio);transition:transform .32s var(--ease),background-color .2s var(--ease)}
.cabecalho .wrap{display:flex;align-items:center;justify-content:space-between;height:84px;gap:1.5rem;max-width:none}
.cabecalho.rolou{background:rgba(255,255,255,.86)}
.cabecalho.escondido{transform:translateY(-100%)}
.marca{display:flex;align-items:center;gap:.9rem;text-decoration:none;min-height:44px;position:relative;z-index:3}
.monograma{width:2.9rem;height:2.9rem;border-radius:50%;box-shadow:inset 0 0 0 1px var(--marinho);display:inline-flex;align-items:center;justify-content:center;font-family:var(--titulo);font-size:1.35rem;color:var(--marinho);flex:none;transition:color .2s,box-shadow .2s}
.marca-txt{display:flex;flex-direction:column;line-height:1.2}
.marca strong{font-family:var(--titulo);font-weight:400;font-size:1.45rem;color:var(--marinho);transition:color .2s}
.marca span.prof{font-size:.82rem;color:var(--cinza);transition:color .2s}
.menu{display:flex;align-items:center;gap:.4rem}
.menu a:not(.btn){display:inline-flex;flex-direction:column;align-items:center;gap:.3rem;min-width:5.6rem;min-height:56px;justify-content:center;text-decoration:none;font-size:.86rem;color:var(--grafite);border-radius:4px;transition:color .2s var(--ease)}
.menu a:not(.btn) svg{width:1.35rem;height:1.35rem;color:var(--marinho);transition:transform .2s var(--ease)}
@media (hover:hover){.menu a:not(.btn):hover svg{transform:translateY(-2px)}.menu a:not(.btn):hover{color:var(--marinho)}}
.menu a:not(.btn):active svg{transform:scale(.9)}
.menu .btn{margin-left:1rem;min-height:3rem;padding:0 1.25rem;font-size:.95rem}
.hamb{display:none;width:48px;height:48px;border:0;background:transparent;padding:0;cursor:pointer;position:relative;z-index:3;border-radius:4px}
.hamb span{position:absolute;left:13px;right:13px;top:23px;height:1.5px;background:var(--marinho);transition:transform .28s var(--ease),background-color .2s}
.hamb span:nth-child(1){transform:translateY(-6px)}
.hamb span:nth-child(3){transform:translateY(6px)}
.hamb:active{transform:scale(.92)}
.painel{position:fixed;inset:0;z-index:2;background:var(--marinho);display:flex;flex-direction:column;justify-content:center;padding:100px var(--gutter) 2.5rem;opacity:0;visibility:hidden;transition:opacity .24s var(--ease),visibility 0s linear .24s}
.painel nav{display:flex;flex-direction:column}
.painel nav a{font-family:var(--titulo);font-size:2.2rem;color:var(--porcelana);text-decoration:none;min-height:60px;display:flex;align-items:center;gap:1rem;border-bottom:1px solid rgba(195,204,224,.16);opacity:0;transform:translateY(10px);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.painel nav a svg{width:1.3rem;height:1.3rem;color:var(--champanhe)}
.painel nav a:active{color:var(--champanhe)}
.painel .btn{margin-top:2rem;opacity:0;transform:translateY(10px);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.painel small{display:block;margin-top:1.25rem;color:var(--nevoa);font-size:.95rem}
.cabecalho.aberto{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;transform:none}
.cabecalho.aberto .painel{opacity:1;visibility:visible;transition:opacity .24s var(--ease),visibility 0s}
.cabecalho.aberto .painel nav a,.cabecalho.aberto .painel .btn{opacity:1;transform:none;transition-delay:calc(.06s + var(--i,0)*.035s)}
.cabecalho.aberto .hamb span{background:var(--porcelana)}
.cabecalho.aberto .hamb span:nth-child(1){transform:rotate(45deg)}
.cabecalho.aberto .hamb span:nth-child(2){transform:scaleX(0)}
.cabecalho.aberto .hamb span:nth-child(3){transform:rotate(-45deg)}
.cabecalho.aberto .marca strong,.cabecalho.aberto .monograma{color:var(--porcelana)}
.cabecalho.aberto .monograma{box-shadow:inset 0 0 0 1px var(--champanhe)}
.cabecalho.aberto .marca span.prof{color:var(--nevoa)}

/* ---------- hero ---------- */
.hero{position:relative;padding-top:84px;background:var(--porcelana);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 45% 0 0;background:linear-gradient(115deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,0) 55%);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);min-height:min(820px,calc(100svh - 84px));max-width:none;padding-right:0;padding-left:max(var(--gutter),calc((100vw - var(--larg))/2 + var(--gutter)))}
.hero-texto{align-self:center;padding:4.5rem 3.5rem 4.5rem 0;max-width:41rem}
.hero h1{font-size:clamp(2.6rem,4.6vw,4.25rem);line-height:1.06}
.hero-sub{margin-top:1.6rem;font-size:1.15rem;color:var(--cinza);max-width:30rem;font-weight:400}
.hero-fatos{list-style:none;margin:2.4rem 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:30rem}
.hero-fatos li{display:flex;flex-direction:column;gap:.7rem;padding:0 1.1rem;font-size:.9rem;line-height:1.45;color:var(--cinza);border-left:1px solid var(--fio)}
.hero-fatos li:first-child{padding-left:0;border-left:0}
.hero-fatos strong{display:block;font-weight:600;color:var(--marinho);font-size:.98rem;margin-bottom:.15rem}
.hero-acoes{margin-top:2.4rem;display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.75rem}
.hero-foto{position:relative;margin:0;align-self:stretch;min-height:520px}
.hero-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;border-top-left-radius:46% 30%}

/* entrada da hero */
.js .hero [data-entra]{opacity:0;transform:translateY(10px)}
.js .hero .hero-foto img{opacity:0;transform:scale(1.04);transform-origin:70% 30%}
.js .pronto .hero [data-entra]{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(.1s + var(--i,0)*.07s)}
.js .pronto .hero .hero-foto img{opacity:1;transform:none;transition:opacity 1s var(--ease) .05s,transform 1.4s var(--ease) .05s}

/* ---------- seções ---------- */
.secao{padding:clamp(4.5rem,9vw,7.5rem) 0}
.cab-secao{max-width:44rem;margin-bottom:clamp(2.5rem,5vw,3.5rem)}
.cab-secao.centro{margin-left:auto;margin-right:auto;text-align:center}
.secao h2,.cab-secao h2{font-size:clamp(2.1rem,3.8vw,3.2rem)}
.cab-secao p{margin-top:1.1rem;color:var(--cinza);max-width:38rem}
.cab-secao.centro p{margin-left:auto;margin-right:auto}

/* antes de tudo */
.antes{background:var(--branco)}
.antes-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(2.5rem,6vw,6rem);align-items:center}
.destaque{margin-top:1.5rem;font-family:var(--titulo);font-size:clamp(1.35rem,2vw,1.65rem);line-height:1.4;color:var(--marinho)}
.antes-apoio{margin-top:1.25rem;color:var(--cinza);max-width:34rem}
.antes-grid .btn{margin-top:2.2rem}
.frases-box{background:var(--porcelana);border-radius:4px;padding:2.2rem 2.2rem 1.4rem}
.frases-titulo{font-size:.95rem;color:var(--cinza);margin-bottom:.4rem}
.frases{list-style:none;margin:0;padding:0}
.frases li{display:flex;gap:1rem;align-items:flex-start;padding:1.15rem 0;border-top:1px solid var(--fio);font-family:var(--titulo);font-size:1.2rem;line-height:1.45;color:var(--marinho)}
.frases li:first-child{border-top:0}
.frases li::before{content:"\201C";font-size:2rem;line-height:1;color:var(--ouro-texto);margin-top:-.1rem;flex:none;width:1rem}

/* cartões no estilo da referência */
.cartoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.cartao{display:flex;flex-direction:column;align-items:center;text-align:center;padding:2.75rem 2rem 2.6rem;border-radius:4px;background:var(--branco);transition:transform .2s var(--ease)}
.cartao.tom-azul{background:var(--tom-azul)}
.cartao.tom-ouro{background:var(--tom-ouro)}
.cartao .circ{margin-bottom:1.6rem}
.cartao h3{font-size:1.65rem;line-height:1.2}
.cartao .tecnica{margin-top:.45rem;font-size:.9rem;color:var(--ouro-texto)}
.cartao p{margin-top:1.1rem;font-size:1rem;line-height:1.65;color:var(--grafite);max-width:22rem}
@media (hover:hover){
  .cartao:hover{transform:translateY(-3px)}
  .cartao:hover .circ{background:var(--marinho);color:var(--porcelana)}
}
.metodo{background:var(--porcelana)}
.atend{background:var(--porcelana)}
.atend-nota{margin-top:2rem;color:var(--cinza);text-align:center}

/* faixa de objetivos (como a faixa de confiança da referência) */
.objetivos{background:var(--tom-azul);padding:clamp(3rem,6vw,4.25rem) 0}
.objetivos h2{font-size:clamp(1.6rem,2.6vw,2.1rem);margin-bottom:2.2rem;text-align:center}
.obj-lista{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.obj-lista li{display:flex;align-items:center;gap:1rem;padding:.4rem 1.6rem;font-size:.98rem;line-height:1.45;color:var(--grafite);border-left:1px solid rgba(13,35,82,.18)}
.obj-lista li:first-child{border-left:0;padding-left:0}

/* como funciona */
.funciona{background:var(--branco)}
.passos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2rem;position:relative}
.passos::before{content:"";position:absolute;left:1.7rem;right:1.7rem;top:1.7rem;height:1px;background:var(--fio)}
.passos::after{content:"";position:absolute;left:1.7rem;right:1.7rem;top:1.7rem;height:1px;background:var(--marinho);transform-origin:left;transform:scaleX(var(--prog,1))}
.passo{position:relative}
.passo .num{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;width:3.4rem;height:3.4rem;border-radius:50%;background:var(--branco);box-shadow:inset 0 0 0 1px var(--marinho);font-family:var(--titulo);color:var(--marinho);font-size:1.35rem;transition:background-color .3s var(--ease),color .3s var(--ease)}
.passo.ativo .num{background:var(--marinho);color:var(--porcelana)}
.passo h3{margin-top:1.4rem;font-size:1.5rem}
.passo p{margin-top:.6rem;color:var(--cinza);font-size:1rem}
.nota-primeira{margin-top:1rem;font-size:.95rem;padding-left:.9rem;border-left:2px solid var(--champanhe);color:var(--grafite)}
.funciona-cta{margin-top:3.25rem;display:flex;justify-content:center}

/* local */
.local{background:var(--porcelana)}
.local-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(1.5rem,3vw,2.5rem);align-items:stretch}
.local-foto{margin:0}
.local-foto img{width:100%;height:100%;min-height:24rem;object-fit:cover;border-top-right-radius:38% 30%;border-radius:4px 38% 4px 4px / 4px 30% 4px 4px}
.local-info{display:flex;flex-direction:column;gap:1rem}
.local-cta{align-self:flex-start;margin-top:.5rem}
.bloco{border-radius:4px;padding:2rem 1.9rem;display:flex;gap:1.25rem;align-items:flex-start}
.bloco h3{font-size:1.45rem;margin-bottom:.6rem}
.bloco-claro{background:var(--branco)}
.bloco-claro address{font-style:normal;color:var(--grafite)}
.bloco-claro .link-seta{margin-top:.5rem}
.bloco-linha{background:var(--tom-ouro)}
.bloco-linha p{color:var(--grafite)}
.bloco-linha ul{margin:.5rem 0 0;padding-left:1.1rem}
.bloco-linha li{margin:.2rem 0}
.bloco-linha li::marker{color:var(--ouro-texto)}

/* depoimentos */
.depo-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.depo{background:var(--branco);border-radius:4px;padding:2rem 1.75rem;display:flex;flex-direction:column;gap:1.25rem}
.depo blockquote{margin:0;font-family:var(--titulo);font-size:1.15rem;color:var(--marinho)}
.depo footer{display:flex;align-items:center;gap:.8rem;font-weight:500;color:var(--marinho)}
.depo footer small{display:block;font-weight:400;color:var(--cinza)}
.avatar{width:2.8rem;height:2.8rem;border-radius:50%;box-shadow:inset 0 0 0 1px var(--marinho);color:var(--marinho);display:inline-flex;align-items:center;justify-content:center;font-family:var(--titulo);flex:none;object-fit:cover}

/* sobre */
.sobre{background:var(--branco)}
.sobre-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(2.5rem,6vw,6rem);align-items:center}
.sobre-foto{margin:0;position:relative}
.sobre-foto img{position:relative;z-index:1;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 25%;border-radius:999px 999px 4px 4px}
.sobre-foto::after{content:"";position:absolute;inset:1.1rem -1.1rem -1.1rem 1.1rem;border-radius:999px 999px 4px 4px;box-shadow:inset 0 0 0 1px var(--champanhe);z-index:0}
.sobre-texto p{margin-top:1.1rem;color:var(--grafite);max-width:36rem}
.selo{margin-top:2rem;display:flex;align-items:center;gap:1rem;padding:1.1rem 1.25rem;border-radius:4px;background:var(--tom-ouro);max-width:32rem}
.selo .circ{box-shadow:inset 0 0 0 1px var(--ouro-texto);color:var(--ouro-texto)}
.selo p{margin:0;font-size:.95rem;line-height:1.45}
.selo strong{color:var(--marinho);font-weight:600}
.crp{margin-top:1.25rem;font-size:.95rem;color:var(--cinza)}
.sobre-acoes{margin-top:2rem;display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}

/* dúvidas */
.duvidas{background:var(--porcelana)}
.faq-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(2rem,5vw,5rem);align-items:start}
.faq{background:var(--branco);border-radius:4px;padding:.5rem 2rem 2rem}
.faq details{border-bottom:1px solid var(--fio)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1.25rem;min-height:4.4rem;padding:1rem 0;font-family:var(--titulo);font-size:1.25rem;line-height:1.35;color:var(--marinho)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .mais{position:relative;width:2.2rem;height:2.2rem;border-radius:50%;box-shadow:inset 0 0 0 1px var(--fio);flex:none;transition:background-color .2s var(--ease),box-shadow .2s var(--ease)}
.faq summary .mais::before,.faq summary .mais::after{content:"";position:absolute;left:50%;top:50%;width:.8rem;height:1.5px;margin:-.75px 0 0 -.4rem;background:var(--marinho);transition:transform .22s var(--ease),background-color .2s}
.faq summary .mais::after{transform:rotate(90deg)}

/* ========== movimento (uma curva só: --ease) ========== */
:root{interpolate-size:allow-keywords}

/* barra de leitura no cabeçalho */

/* títulos de seção sobem por trás de uma máscara */
.js h2[data-revelar]{opacity:1;transform:none;clip-path:inset(0 0 100% 0);translate:0 .45em;transition:clip-path .9s var(--ease),translate .9s var(--ease)}
.js h2[data-revelar].visivel{clip-path:inset(-.3em -.3em -.4em -.3em);translate:0 0}

/* fotos se abrem de baixo para cima e assentam */
.js .local-foto[data-revelar],.js .sobre-foto[data-revelar]{opacity:1;transform:none;clip-path:inset(35% 0 0 0);transition:clip-path 1.1s var(--ease)}

.js .local-foto[data-revelar] img,.js .sobre-foto[data-revelar] img{transform:scale(1.08);transition:transform 1.4s var(--ease)}
.js .local-foto[data-revelar].visivel img,.js .sobre-foto[data-revelar].visivel img{transform:none}
.hero-foto{will-change:translate}

/* frases: entram uma a uma */
.js .frases-box[data-revelar] .frases li{opacity:0;translate:-12px 0;transition:opacity .5s var(--ease),translate .5s var(--ease),color .3s var(--ease)}
.js .frases-box[data-revelar].visivel .frases li{opacity:1;translate:0 0}
.frases li:nth-child(2){transition-delay:.06s}.frases li:nth-child(3){transition-delay:.12s}.frases li:nth-child(4){transition-delay:.18s}.frases li:nth-child(5){transition-delay:.24s}
.frases li::before{transition:transform .3s var(--ease),color .3s var(--ease)}

/* cartões: ícone e etiqueta chegam depois do cartão */
.cartao .tecnica{display:inline-block;margin-top:.7rem;padding:.25rem .8rem;border-radius:999px;background:rgba(122,94,38,.09);font-size:.86rem;line-height:1.4}

.js .cartao[data-revelar] .circ{scale:.55;opacity:0;transition:scale .7s var(--ease) .18s,opacity .4s var(--ease) .18s,background-color .2s var(--ease),color .2s var(--ease)}
.js .cartao[data-revelar] .tecnica{opacity:0;translate:0 6px;transition:opacity .5s var(--ease) .3s,translate .5s var(--ease) .3s}
.js .cartao[data-revelar].visivel .circ{scale:1;opacity:1}
.js .cartao[data-revelar].visivel .tecnica{opacity:1;translate:0 0}
.cartao{transition:transform .2s var(--ease),scale .4s var(--ease),box-shadow .3s var(--ease)}
.js .cartao[data-revelar].visivel{transition:opacity .6s var(--ease) calc(var(--i,0)*.06s),transform .2s var(--ease),scale .4s var(--ease),box-shadow .3s var(--ease)}
.cartao:active{transform:scale(.985)}
@media (hover:hover){.cartao:hover{box-shadow:0 18px 40px -28px rgba(13,35,82,.45)}}

/* objetivos: ícones se acendem em sequência */

/* linha do tempo: o número pulsa ao ser alcançado */
.passo.ativo .num{animation:pulso-num .5s var(--ease)}
@keyframes pulso-num{0%{scale:1}40%{scale:1.14}100%{scale:1}}

/* botões: onda a partir do toque, ícone do WhatsApp balança */
.btn,.icone-btn,.rodape .redes a{position:relative;overflow:hidden;isolation:isolate}
.onda{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);pointer-events:none;z-index:-1;animation:onda .6s var(--ease) forwards}
@keyframes onda{to{transform:scale(1);opacity:0}}
@keyframes balanco{0%{rotate:0deg}30%{rotate:-14deg}60%{rotate:9deg}100%{rotate:0deg}}

.btn:active > svg:first-child:not(.seta){animation:balanco .5s var(--ease)}

/* ícones redondos (Instagram, WhatsApp, Google): o círculo se preenche de dentro para fora */
.icone-btn::before,.rodape .redes a::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--marinho);transform:scale(0);transition:transform .28s var(--ease);z-index:-1}

.painel{opacity:1;clip-path:circle(0px at calc(100% - var(--gutter) - 24px) 36px);transition:clip-path .45s var(--ease),visibility 0s linear .45s}

.cabecalho.aberto .painel nav a{transition-delay:calc(.14s + var(--i,0)*.045s)}
.cabecalho.aberto .painel nav a::after{transform:scaleX(1);transition-delay:calc(.24s + var(--i,0)*.045s)}

.barra .btn::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 2px var(--champanhe);opacity:0;pointer-events:none}

@keyframes anel{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.06,1.35)}}

.aviso{transform:translate(-50%,14px) scale(.96)}

/* dúvidas: abre e fecha com altura suave onde o navegador permite */
